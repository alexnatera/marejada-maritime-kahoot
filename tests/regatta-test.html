<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marejada 2.0 — Live Regatta 2.0 Engine Test & Simulator</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/regatta.css">
  <style>
    :root {
      --bg: #041225;
      --card-bg: rgba(11, 53, 89, 0.55);
      --card-border: rgba(52, 152, 219, 0.25);
      --accent: #D4A843;
      --accent-red: #E4001A;
      --accent-blue: #3498DB;
      --accent-green: #2ECC71;
      --text: #F4F6F8;
      --text-muted: #8FA2B6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: radial-gradient(circle at 50% 15%, #0B3559 0%, #041225 75%);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }
    .container {
      max-width: 1040px;
      width: 100%;
    }
    header {
      text-align: center;
      margin-bottom: 2rem;
    }
    h1 {
      font-size: 2.2rem;
      color: var(--accent);
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
    }
    p.subtitle {
      color: var(--text-muted);
      font-size: 1rem;
    }
    .control-panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 1.5rem;
      margin-bottom: 2rem;
      backdrop-filter: blur(12px);
      box-shadow: 0 12px 32px rgba(4, 18, 37, 0.5);
    }
    .panel-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }
    .btn {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 8px;
      padding: 0.6rem 1.1rem;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }
    .btn:hover {
      background: rgba(255, 255, 255, 0.16);
      transform: translateY(-2px);
    }
    .btn-gold {
      background: linear-gradient(135deg, #D4A843 0%, #B3862A 100%);
      color: #041225;
      border: none;
      font-weight: 700;
    }
    .btn-gold:hover {
      background: linear-gradient(135deg, #e6bc5a 0%, #c49432 100%);
    }
    .btn-red {
      background: linear-gradient(135deg, #E4001A 0%, #B30015 100%);
      color: #fff;
      border: none;
    }
    .btn-blue {
      background: linear-gradient(135deg, #3498DB 0%, #1D6FA5 100%);
      color: #fff;
      border: none;
    }
    .test-results-card {
      background: rgba(4, 18, 37, 0.85);
      border: 1px solid rgba(52, 152, 219, 0.3);
      border-radius: 12px;
      padding: 1.25rem;
      margin-top: 2rem;
    }
    .test-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.5rem 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 0.9rem;
    }
    .test-item:last-child { border-bottom: none; }
    .badge-pass {
      background: rgba(46, 204, 113, 0.2);
      color: #2ECC71;
      border: 1px solid #2ECC71;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1><span>⚓</span> Motor de Regata Naval en Vivo 2.0</h1>
      <p class="subtitle">Simulador y Suite de Verificación de Pistas Náuticas, Adelantamientos y Badges</p>
    </header>

    <div class="control-panel">
      <div class="panel-title">🎮 Panel de Control de Simulación de Regata</div>
      <div class="btn-group">
        <button id="btnNextRound" class="btn btn-gold">▶️ Siguiente Ronda (Adelantamiento en Vivo)</button>
        <button id="btnComeback" class="btn btn-red">🚀 Simular Remontada Épica (8º al 1º)</button>
        <button id="btnNitro" class="btn btn-blue">🔥 Activar Turbo Rachas (Streak >= 2)</button>
        <button id="btnTop5" class="btn">Top 5</button>
        <button id="btnTop8" class="btn">Top 8</button>
        <button id="btnAll" class="btn">Toda la Flota (12 Buques)</button>
        <button id="btnProjector" class="btn">📽️ Modo Proyector</button>
        <button id="btnReset" class="btn">🔄 Reiniciar</button>
      </div>
      <div id="simLog" style="font-size: 0.85rem; color: var(--accent); min-height: 20px;"></div>
    </div>

    <!-- Contenedor Principal de la Regata -->
    <div id="regattaContainer"></div>

    <!-- Suite de Pruebas Automatizadas -->
    <div class="test-results-card">
      <div class="panel-title">🧪 Resultados de la Suite de Pruebas Unitarias</div>
      <div id="unitTestList"></div>
    </div>
  </div>

  <script src="../js/icons.js"></script>
  <script src="../js/regatta.js"></script>
  <script>
    // Datos iniciales de simulación
    const INITIAL_FLEET = [
      { id: '1', name: 'Capitán Jack', score: 3200, avatar: 'tug', streak: 3 },
      { id: '2', name: 'Almirante Nelson', score: 2900, avatar: 'container', streak: 2 },
      { id: '3', name: 'Timonel Morgan', score: 2650, avatar: 'tanker', streak: 1 },
      { id: '4', name: 'Oficial Drake', score: 2200, avatar: 'ferry', streak: 0 },
      { id: '5', name: 'Marinero Barbanegra', score: 1950, avatar: 'sailboat', streak: 1 },
      { id: '6', name: 'Comandante Sparrow', score: 1600, avatar: 'cruise', streak: 0 },
      { id: '7', name: 'Grúas Valparaíso', score: 1200, avatar: 'fishing', streak: 0 },
      { id: '8', name: 'Remolcador Humboldt', score: 850, avatar: 'jetski', streak: 0 },
      { id: '9', name: 'Vanguardia Polar', score: 700, avatar: 'icebreaker', streak: 0 },
      { id: '10', name: 'Nautilus Deep', score: 550, avatar: 'submarine', streak: 0 },
      { id: '11', name: 'Kayak Patagónico', score: 400, avatar: 'kayak', streak: 0 },
      { id: '12', name: 'Yate Austral', score: 200, avatar: 'yacht', streak: 0 }
    ];

    let currentFleet = JSON.parse(JSON.stringify(INITIAL_FLEET));
    let previousFleet = null;
    let viewMode = 'top8';
    let projectorMode = false;
    let roundNum = 1;

    const container = document.getElementById('regattaContainer');
    const logEl = document.getElementById('simLog');

    function updateRegattaView() {
      RegattaEngine.render(container, currentFleet, previousFleet, {
        viewMode,
        projectorMode,
        title: `Regata Naval 2.0 — Ronda ${roundNum}`
      });
    }

    // Inicializar render
    updateRegattaView();

    // Eventos de botones
    document.getElementById('btnNextRound').addEventListener('click', async () => {
      roundNum++;
      previousFleet = JSON.parse(JSON.stringify(currentFleet));
      
      // Simular incremento de puntajes aleatorio
      currentFleet.forEach(p => {
        const gain = Math.floor(Math.random() * 800) + 200;
        p.score += gain;
        if (Math.random() > 0.4) {
          p.streak = (p.streak || 0) + 1;
        } else {
          p.streak = 0;
        }
      });

      logEl.textContent = `⚡ Ronda ${roundNum} ejecutada: Barcos avanzando y adelantando posiciones...`;
      await RegattaEngine.animateTransition(container, previousFleet, currentFleet, {
        viewMode,
        projectorMode,
        title: `Regata Naval 2.0 — Ronda ${roundNum}`
      });
    });

    document.getElementById('btnComeback').addEventListener('click', async () => {
      roundNum++;
      previousFleet = JSON.parse(JSON.stringify(currentFleet));
      
      // Encontrar el último del top 8 y darle un salto épico a primer lugar
      const sorted = [...currentFleet].sort((a,b) => b.score - a.score);
      const underDog = sorted[Math.min(7, sorted.length - 1)];
      const maxScore = Math.max(...currentFleet.map(p => p.score));
      
      underDog.score = maxScore + 1000;
      underDog.streak = 4;

      logEl.textContent = `🚀 ¡Mayor Remontada activada! "${underDog.name}" escala al 1er lugar.`;
      await RegattaEngine.animateTransition(container, previousFleet, currentFleet, {
        viewMode,
        projectorMode,
        title: `Regata Naval 2.0 — ¡Remontada Épica!`
      });
    });

    document.getElementById('btnNitro').addEventListener('click', () => {
      currentFleet.forEach(p => p.streak = 3);
      logEl.textContent = `🔥 Turbos y llamas activados para toda la flota en racha.`;
      updateRegattaView();
    });

    document.getElementById('btnTop5').addEventListener('click', () => {
      viewMode = 'top5';
      updateRegattaView();
    });

    document.getElementById('btnTop8').addEventListener('click', () => {
      viewMode = 'top8';
      updateRegattaView();
    });

    document.getElementById('btnAll').addEventListener('click', () => {
      viewMode = 'all';
      updateRegattaView();
    });

    document.getElementById('btnProjector').addEventListener('click', () => {
      projectorMode = !projectorMode;
      logEl.textContent = `📽️ Modo Proyector: ${projectorMode ? 'Activado' : 'Desactivado'}`;
      updateRegattaView();
    });

    document.getElementById('btnReset').addEventListener('click', () => {
      currentFleet = JSON.parse(JSON.stringify(INITIAL_FLEET));
      previousFleet = null;
      roundNum = 1;
      logEl.textContent = `🔄 Regata reiniciada al estado inicial.`;
      updateRegattaView();
    });

    // Suite de Pruebas Automatizadas
    function runUnitTests() {
      const tests = [
        {
          name: 'RegattaEngine está definido y exporta métodos requeridos',
          run: () => typeof RegattaEngine.render === 'function' && typeof RegattaEngine.animateTransition === 'function' && typeof RegattaEngine.calculateRanks === 'function'
        },
        {
          name: 'calculateRanks ordena correctamente por puntaje descendente',
          run: () => {
            const res = RegattaEngine.calculateRanks([{ id: 'a', score: 100 }, { id: 'b', score: 500 }]);
            return res.rankedPlayers[0].id === 'b' && res.rankedPlayers[1].id === 'a';
          }
        },
        {
          name: 'Badge de Líder de Flota asignado correctamente al 1er lugar',
          run: () => {
            const res = RegattaEngine.calculateRanks([{ id: 'a', score: 100 }, { id: 'b', score: 500 }]);
            return res.leader.id === 'b' && res.rankedPlayers[0].isLeader === true;
          }
        },
        {
          name: 'Mayor Remontada calcula delta y destaca al jugador que más puestos subió',
          run: () => {
            const prev = [{ id: 'a', score: 1000 }, { id: 'b', score: 900 }, { id: 'c', score: 800 }, { id: 'd', score: 100 }];
            const next = [{ id: 'd', score: 1500 }, { id: 'a', score: 1000 }, { id: 'b', score: 900 }, { id: 'c', score: 800 }];
            const res = RegattaEngine.calculateRanks(next, prev);
            return res.comebackPlayer && res.comebackPlayer.id === 'd' && res.bestDelta === 3;
          }
        },
        {
          name: 'En Racha Turbo (Nitro) se activa con streak >= 2',
          run: () => {
            const res = RegattaEngine.calculateRanks([{ id: 'a', score: 500, streak: 2 }, { id: 'b', score: 400, streak: 1 }]);
            return res.rankedPlayers[0].hasNitro === true && res.rankedPlayers[1].hasNitro === false;
          }
        },
        {
          name: 'Escala de distancia y millas náuticas calculadas adecuadamente',
          run: () => {
            const res = RegattaEngine.calculateRanks([{ id: 'a', score: 1000 }], null, { maxDistanceNm: 10 });
            return res.rankedPlayers[0].distanceNm === '10.0';
          }
        },
        {
          name: 'render() genera elementos de pista, boyas de meta y carriles en DOM',
          run: () => {
            const dummy = document.createElement('div');
            RegattaEngine.render(dummy, INITIAL_FLEET, null, { viewMode: 'top5' });
            return dummy.querySelectorAll('.regatta-lane').length === 5 && dummy.querySelector('.regatta-buoy-finish') !== null;
          }
        }
      ];

      const testList = document.getElementById('unitTestList');
      testList.innerHTML = tests.map(t => {
        let pass = false;
        try { pass = t.run(); } catch(e) { console.error(e); }
        return `
          <div class="test-item">
            <span>${pass ? '✅' : '❌'} ${t.name}</span>
            <span class="badge-pass">${pass ? 'PASÓ' : 'FALLÓ'}</span>
          </div>
        `;
      }).join('');
    }

    runUnitTests();
  </script>
</body>
</html>
